name: FareEnough UX review

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/app/v2-preview/**'
      - 'src/app/layout.tsx'
      - 'src/app/globals.css'
      - 'src/components/route-runtime.tsx'
      - 'public/avatars/animals/**'
      - 'tests/ux-review/**'
      - 'scripts/ux-review/**'
      - 'scripts/test-v2-airport-timing.mjs'
      - 'scripts/test-v2-departure-time.mjs'
      - 'docs/ux-review/**'
      - 'playwright.ux.config.mjs'
      - 'playwright.personas.config.mjs'
      - 'package*.json'
      - 'next.config.*'
      - '.github/workflows/ux-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fareenough-ux-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chromium and CJK fonts
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Lint preview and review infrastructure
        run: npx eslint src/app/v2-preview scripts/ux-review tests/ux-review scripts/test-v2-departure-time.mjs playwright.ux.config.mjs playwright.personas.config.mjs --max-warnings 0
      - name: Generate synthetic UX review
        shell: bash
        run: |
          mkdir -p test-results
          npm run ux:review 2>&1 | tee test-results/ux-review-run.log
      - name: Replay synthetic persona exploration (diagnostic task results)
        shell: bash
        run: |
          npm run ux:personas 2>&1 | tee test-results/persona-review-run.log
      - name: Upload current evidence, audits and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fareenough-ux-review-${{ github.run_id }}
          path: |
            test-results/ux-review/
            test-results/ux-review-run.log
            playwright-report/ux-review/
            test-results/persona-review/
            test-results/persona-review-run.log
            playwright-report/persona-review/
            docs/ux-review/PERSONA-EVIDENCE.json
            docs/ux-review/REPAIR-REGRESSIONS.json
          retention-days: 7
          if-no-files-found: warn
